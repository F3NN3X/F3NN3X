  .pic{width:100%}
  .pic img{width:100%;height:auto;display:block}
  .dark{display:none}
  body.dk{--bg:#0d1117;--tab:#161b22;--tabfg:#8b949e;--line:#30363d;--fg:#ddd}

  body.dk .dark{display:block}
</style>
