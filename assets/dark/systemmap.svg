<style>
  .mono{font-family:ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes draw{from{stroke-dashoffset:var(--l,0)}to{stroke-dashoffset:0}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
  @keyframes march{to{stroke-dashoffset:-12}}
  .rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  .fade{animation:fade .8s ease both}
  .draw{animation:draw 1.5s cubic-bezier(.6,0,.2,1) both}
  .grow{transform-box:fill-box;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  .breathe{animation:breathe 3.2s ease-in-out infinite}
  .march{stroke-dasharray:3 9;animation:march 1.4s linear infinite}
  .s0{animation-delay:0.05s} .s1{animation-delay:0.11s} .s2{animation-delay:0.17s} .s3{animation-delay:0.23s} .s4{animation-delay:0.29s} .s5{animation-delay:0.35s} .s6{animation-delay:0.41s} .s7{animation-delay:0.47s} .s8{animation-delay:0.53s} .s9{animation-delay:0.59s} .s10{animation-delay:0.65s} .s11{animation-delay:0.71s} .s12{animation-delay:0.77s} .s13{animation-delay:0.83s} .s14{animation-delay:0.89s} .s15{animation-delay:0.95s} .s16{animation-delay:1.01s} .s17{animation-delay:1.07s} .s18{animation-delay:1.13s} .s19{animation-delay:1.19s} .s20{animation-delay:1.25s} .s21{animation-delay:1.31s} .s22{animation-delay:1.37s} .s23{animation-delay:1.43s} .s24{animation-delay:1.49s} .s25{animation-delay:1.55s} .s26{animation-delay:1.61s} .s27{animation-delay:1.67s} .s28{animation-delay:1.73s} .s29{animation-delay:1.79s}
  @media (prefers-reduced-motion:reduce){
    .rise,.fade,.draw,.grow,.pulse,.breathe,.march{animation:none}
  }
</style>
