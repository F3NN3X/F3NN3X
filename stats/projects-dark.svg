<svg xmlns="http://www.w3.org/2000/svg" width="450" height="195" viewBox="0 0 450 195" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Projects</title>
<desc id="desc">InfoPanel.FPS (11 stars): C# · FPS plugin for InfoPanel using PresentmonFPS. InfoPanel.Spotify (5 stars): C# · Spotify plugin for InfoPanel that shows your current playing track. InfoPanel.IPFPS (4 stars): C# · Intel Presentmon FPS plugin for InfoPanel. InfoPanel.RTSS (4 stars): C# · InfoPanel plugin utilizing RTSS to show FPS metrics. NuttySpotifyMeld (2 stars): HTML · Meld Studio port of NuttyLmao Spotify Widget. InfoPanel.Presentmon (2 stars): C# · InfoPanel Plugin using Intel Presentmon API</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #7d8590; letter-spacing: 0.04em; }
  .secondary { fill: #9198a1; }
  .muted { fill: #7d8590; }
  .icon { fill: #9198a1; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .scroll { animation: scroll 20s ease-in-out 0s infinite; }
  @keyframes scroll { 0.00%, 46.00% { transform: translateY(-0px); } 50.00%, 96.00% { transform: translateY(-138px); } 100% { transform: translateY(0); } }
</style>
