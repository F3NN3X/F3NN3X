<svg xmlns="http://www.w3.org/2000/svg" width="350" height="195" viewBox="0 0 350 195" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Year by year</title>
<desc id="desc">Contributions per year: 2026 9123 (Media · Spotify · MetYr), 2025 1221 (InfoPanel plugin surge), 2024 16.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #818b98; letter-spacing: 0.04em; }
  .secondary { fill: #59636e; }
  .muted { fill: #818b98; }
  .icon { fill: #59636e; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="349" height="194" rx="6" fill="none" stroke="none"/>
<text x="20" y="28" class="col">YEAR BY YEAR</text>
<g transform="translate(20 46)"><g class="fade" style="animation-delay: 200ms"><text x="0" y="13" class="value">2026</text><text x="44" y="13" class="small muted">Media · Spotify · MetYr</text><text x="310" y="13" class="value" text-anchor="end">9,123</text><rect y="22" width="310" height="8" rx="4" fill="#d1d9e0"/><rect class="grow" y="22" width="310.0" height="8" rx="4" fill="#9be9a8"/></g></g>
<g transform="translate(20 92)"><g class="fade" style="animation-delay: 290ms"><text x="0" y="13" class="value">2025</text><text x="44" y="13" class="small muted">InfoPanel plugin surge</text><text x="310" y="13" class="value" text-anchor="end">1,221</text><rect y="22" width="310" height="8" rx="4" fill="#d1d9e0"/><rect class="grow" y="22" width="41.5" height="8" rx="4" fill="#216e39"/></g></g>
<g transform="translate(20 138)"><g class="fade" style="animation-delay: 380ms"><text x="0" y="13" class="value">2024</text><text x="310" y="13" class="value" text-anchor="end">16</text><rect y="22" width="310" height="8" rx="4" fill="#d1d9e0"/><rect class="grow" y="22" width="0.5" height="8" rx="4" fill="#216e39"/></g></g>
