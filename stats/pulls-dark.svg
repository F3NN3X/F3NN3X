<svg xmlns="http://www.w3.org/2000/svg" width="350" height="195" viewBox="0 0 350 195" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Pull requests</title>
<desc id="desc">Opened: 1946. Merged: 1914. Merge rate: 99%. Median time to merge: under 1h. Open now: 4. Closed unmerged: 28.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #7d8590; letter-spacing: 0.04em; }
  .secondary { fill: #9198a1; }
  .muted { fill: #7d8590; }
  .icon { fill: #9198a1; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="349" height="194" rx="6" fill="none" stroke="none"/>
<text x="20" y="28" class="col">PULL REQUESTS</text>
<g transform="translate(20 46)"><g class="fade" style="animation-delay: 200ms"><text y="18" style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">1,946</text><text y="35" class="small secondary">Opened</text></g></g>
<g transform="translate(175 46)"><g class="fade" style="animation-delay: 290ms"><text y="18" style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">1,914</text><text y="35" class="small secondary">Merged</text></g></g>
<g transform="translate(20 94)"><g class="fade" style="animation-delay: 380ms"><text y="18" style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">99%</text><text y="35" class="small secondary">Merge rate</text></g></g>
<g transform="translate(175 94)"><g class="fade" style="animation-delay: 470ms"><text y="18" style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">under 1h</text><text y="35" class="small secondary">Median time to merge</text></g></g>
<g transform="translate(20 142)"><g class="fade" style="animation-delay: 560ms"><text y="18" style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">4</text><text y="35" class="small secondary">Open now</text></g></g>
<g transform="translate(175 142)"><g class="fade" style="animation-delay: 650ms"><text y="18" style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">28</text><text y="35" class="small secondary">Closed unmerged</text></g></g>
</svg>
